name: NEXUS Automated Research

on:
  workflow_dispatch:
  schedule:
    - cron: "15 0 * * *"

permissions:
  contents: read

concurrency:
  group: nexus-automated-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout NEXUS
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm install
      - name: Enforce dependency security audit
        run: npm audit --audit-level=moderate
      - name: Run automated candidate research
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ZAI_MODEL: ${{ vars.ZAI_MODEL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_MODEL: ${{ vars.CLOUDFLARE_AI_MODEL }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
          NEXUS_AI_PROVIDER_ORDER: ${{ vars.NEXUS_AI_PROVIDER_ORDER }}
        run: npx --yes tsx@4.20.6 scripts/automated-research.ts
      - name: Upload research report
        uses: actions/upload-artifact@v4
        with:
          name: nexus-automated-research-${{ github.run_number }}
          path: artifacts/automated-research.json
          if-no-files-found: error
          retention-days: 30

  publish-proposals:
    needs: research
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout NEXUS
        uses: actions/checkout@v4
      - name: Download the completed research report
        uses: actions/download-artifact@v4
        with:
          name: nexus-automated-research-${{ github.run_number }}
          path: artifacts
      - name: Create a sanitised proposal-only feed
        id: feed
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("artifacts/automated-research.json", "utf8"));
          if (report.schemaVersion !== 1 || !report.aiGeneration || !Array.isArray(report.aiGeneration.proposals) || !Array.isArray(report.aiGeneration.composedStrategies)) {
            throw new Error("Automated research report does not match the expected schema");
          }
          if (report.aiGeneration.status !== "generated" || report.aiGeneration.proposals.length < 1 || report.aiGeneration.composedStrategies.length < 1) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "publish=false\n");
            console.log("No validated AI generation in this run; retaining the previous proposal feed.");
            process.exit(0);
          }
          const publication = {
            schemaVersion: 1,
            createdAt: report.createdAt,
            symbol: report.symbol,
            interval: report.interval,
            aiGeneration: {
              status: report.aiGeneration.status,
              provider: report.aiGeneration.provider,
              model: report.aiGeneration.model,
              proposals: report.aiGeneration.proposals,
              composedStrategies: report.aiGeneration.composedStrategies
            }
          };
          fs.writeFileSync("/tmp/ai-strategy-proposals.json", JSON.stringify(publication, null, 2) + "\n");
          NODE
      - name: Publish latest proposal feed to the dedicated branch
        if: steps.feed.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin ai-proposals || true
          if git show-ref --verify --quiet refs/remotes/origin/ai-proposals; then
            git checkout -B ai-proposals origin/ai-proposals
          else
            git checkout --orphan ai-proposals
            git rm -rf . || true
          fi
          cp /tmp/ai-strategy-proposals.json ai-strategy-proposals.json
          git add ai-strategy-proposals.json
          if git diff --cached --quiet; then
            echo "Latest proposal feed is unchanged."
          else
            git commit -m "chore: publish latest AI strategy proposals"
            git push origin ai-proposals
          fi
