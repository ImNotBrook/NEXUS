name: NEXUS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Enforce dependency security audit
        run: npm audit --audit-level=moderate
      - run: npm test
      - name: Type-check scheduled research and paper trading runners
        run: npx tsc --noEmit --strict --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --types node --lib ES2022,DOM scripts/automated-research.ts scripts/paper-trading-agent.ts
      - name: Verify derivatives collector script syntax
        run: node --check scripts/collect-derivatives.cjs
      - name: Type-check public derivatives collector modules
        run: npx tsc src/adapters/bybit-derivatives.ts src/domain/derivatives-data.ts src/domain/derivatives-ledger.ts --rootDir src --outDir /tmp/nexus-derivatives-build --target ES2022 --module commonjs --moduleResolution node --strict --skipLibCheck --lib ES2022,DOM
      - run: npm run build
